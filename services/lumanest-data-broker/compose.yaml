services:
  qweather-token-broker:
    build:
      context: .
      dockerfile: ${BROKER_DOCKERFILE:-Dockerfile}
    container_name: lumanest-qweather-token-broker
    restart: unless-stopped
    environment:
      PORT: "8787"
      ADMIN_PORT: "8788"
      LUMANEST_DATA_DIR: /var/lib/lumanest
      QWEATHER_PRIVATE_KEY_PATH: /run/secrets/qweather-ed25519-private.pem
      QWEATHER_KEY_ID: ${QWEATHER_KEY_ID:?Set QWEATHER_KEY_ID}
      QWEATHER_PROJECT_ID: ${QWEATHER_PROJECT_ID:?Set QWEATHER_PROJECT_ID}
      QWEATHER_API_HOST: ${QWEATHER_API_HOST:?Set QWEATHER_API_HOST}
      LUMANEST_SERVICE_TOKEN: ${LUMANEST_SERVICE_TOKEN:?Set LUMANEST_SERVICE_TOKEN}
      AMAP_WEB_KEY: ${AMAP_WEB_KEY:?Set AMAP_WEB_KEY}
      LUMANEST_CONFIG_MASTER_KEY: ${LUMANEST_CONFIG_MASTER_KEY:?Set LUMANEST_CONFIG_MASTER_KEY}
      LUMANEST_ADMIN_BOOTSTRAP_PASSWORD: ${LUMANEST_ADMIN_BOOTSTRAP_PASSWORD:-}
      LUMANEST_ADMIN_PASSWORD: ${LUMANEST_ADMIN_PASSWORD:-}
      LUMANEST_SIMULATION_ENABLED: ${LUMANEST_SIMULATION_ENABLED:-false}
      CONTEXT_SERVICE_URL: http://context-service:8000
      CONTEXT_INTERNAL_TOKEN: ${CONTEXT_INTERNAL_TOKEN:?Set CONTEXT_INTERNAL_TOKEN}
      DISCOVERY_SERVICE_URL: http://discovery-api:8001
      DISCOVERY_INTERNAL_TOKEN: ${DISCOVERY_INTERNAL_TOKEN:?Set DISCOVERY_INTERNAL_TOKEN}
      DISCOVERY_WORKER_TOKEN: ${DISCOVERY_WORKER_TOKEN:?Set DISCOVERY_WORKER_TOKEN}
      REDIS_URL: redis://redis:6379/0
      LUMANEST_RASTER_SERVICE_URL: ${LUMANEST_RASTER_SERVICE_URL:-}
      LUMANEST_RASTER_SERVICE_TOKEN: ${LUMANEST_RASTER_SERVICE_TOKEN:-}
      LUMANEST_RASTER_DATASET_REVISION: ${LUMANEST_RASTER_DATASET_REVISION:-}
      LUMANEST_TERRAIN_SERVICE_URL: ${LUMANEST_TERRAIN_SERVICE_URL:-}
      LUMANEST_TERRAIN_SERVICE_TOKEN: ${LUMANEST_TERRAIN_SERVICE_TOKEN:-}
      LUMANEST_TERRAIN_DATASET_REVISION: ${LUMANEST_TERRAIN_DATASET_REVISION:-}
      SUNSETBOT_BASE_URL: ${SUNSETBOT_BASE_URL:-https://sunsetbot.top}
      LUMANEST_OUTBOUND_NETWORK_MODE: ${LUMANEST_OUTBOUND_NETWORK_MODE:-direct}
      LUMANEST_OUTBOUND_NETWORK_CONTROLLER_URL: http://outbound-network-controller:8790
      LUMANEST_NETWORK_CONTROLLER_TOKEN: ${LUMANEST_NETWORK_CONTROLLER_TOKEN:?Set LUMANEST_NETWORK_CONTROLLER_TOKEN}
      # Node 22 built-in fetch only honors the standard proxy environment
      # variables when this flag is enabled. Internal service calls bypass it.
      NODE_OPTIONS: "--use-env-proxy"
      HTTP_PROXY: ${LUMANEST_OUTBOUND_PROXY_URL:-}
      HTTPS_PROXY: ${LUMANEST_OUTBOUND_PROXY_URL:-}
      NO_PROXY: 127.0.0.1,localhost,context-service,discovery-api,outbound-network-controller,redis,postgres
    networks:
      - default
      - mihomo
    ports:
      - "8787:8787"
      - "8788:8788"
    volumes:
      - ${QWEATHER_PRIVATE_KEY_FILE:?Set QWEATHER_PRIVATE_KEY_FILE in qweather-token-broker.env}:/run/secrets/qweather-ed25519-private.pem:ro
      - lumanest-data:/var/lib/lumanest
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/healthz >/dev/null && wget -qO- http://127.0.0.1:8788/admin >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      context-service:
        condition: service_healthy

  lumanest-raster-service:
    profiles: ["sky-data"]
    build:
      context: ../lumanest-raster-service
      dockerfile: ${RASTER_DOCKERFILE:-Dockerfile}
    container_name: lumanest-raster-service
    restart: unless-stopped
    environment:
      VIIRS_RASTER_PATH: ${VIIRS_RASTER_PATH:-}
      VIIRS_DATASET_YEAR: ${VIIRS_DATASET_YEAR:-}
      VIIRS_DATASET_REVISION: ${VIIRS_DATASET_REVISION:-}
      VIIRS_SOURCE_ID: ${VIIRS_SOURCE_ID:-}
      VIIRS_ATTRIBUTION: ${VIIRS_ATTRIBUTION:-}
      VIIRS_RESOLUTION_METERS: ${VIIRS_RESOLUTION_METERS:-}
      RASTER_SERVICE_TOKEN: ${LUMANEST_RASTER_SERVICE_TOKEN:-}
    volumes:
      - ${VIIRS_RASTER_HOST_DIR:-/var/empty}:/data/viirs:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8792/healthz', timeout=3))['status'] == 'ok'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  lumanest-terrain-service:
    profiles: ["sky-data"]
    build:
      context: ../lumanest-terrain-service
      dockerfile: ${TERRAIN_DOCKERFILE:-Dockerfile}
    container_name: lumanest-terrain-service
    restart: unless-stopped
    environment:
      DEM_RASTER_PATH: ${DEM_RASTER_PATH:-}
      DEM_DATASET_REVISION: ${DEM_DATASET_REVISION:-}
      DEM_SOURCE_ID: ${DEM_SOURCE_ID:-}
      DEM_ATTRIBUTION: ${DEM_ATTRIBUTION:-}
      DEM_RESOLUTION_METERS: ${DEM_RESOLUTION_METERS:-}
      TERRAIN_SERVICE_TOKEN: ${LUMANEST_TERRAIN_SERVICE_TOKEN:-}
    volumes:
      - ${DEM_RASTER_HOST_DIR:-/var/empty}:/data/dem:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8793/healthz', timeout=3))['status'] == 'ok'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  context-service:
    build:
      context: ../lumanest-context-service
      dockerfile: ${CONTEXT_DOCKERFILE:-Dockerfile}
    container_name: lumanest-context-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://lumanest:${LUMANEST_DATABASE_PASSWORD:?Set LUMANEST_DATABASE_PASSWORD}@postgres/lumanest
      REDIS_URL: redis://redis:6379/0
      CONTEXT_INTERNAL_TOKEN: ${CONTEXT_INTERNAL_TOKEN:?Set CONTEXT_INTERNAL_TOKEN}
      LUMANEST_OUTBOUND_NETWORK_MODE: ${LUMANEST_OUTBOUND_NETWORK_MODE:-direct}
      HTTP_PROXY: ${LUMANEST_OUTBOUND_PROXY_URL:-}
      HTTPS_PROXY: ${LUMANEST_OUTBOUND_PROXY_URL:-}
      NO_PROXY: 127.0.0.1,localhost,qweather-token-broker,discovery-api,redis,postgres
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - mihomo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  discovery-api:
    build: &discovery-api-build
      context: ../lumanest-discovery-service
      dockerfile: ${DISCOVERY_DOCKERFILE:-Dockerfile}
      args:
        DISCOVERY_BASE_IMAGE: ${DISCOVERY_BASE_IMAGE:-qweather-token-broker-context-service:latest}
    container_name: lumanest-discovery-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://lumanest:${LUMANEST_DATABASE_PASSWORD:?Set LUMANEST_DATABASE_PASSWORD}@postgres/lumanest
      REDIS_URL: redis://redis:6379/0
      DISCOVERY_INTERNAL_TOKEN: ${DISCOVERY_INTERNAL_TOKEN:?Set DISCOVERY_INTERNAL_TOKEN}
      LUMANEST_OUTBOUND_NETWORK_MODE: ${LUMANEST_OUTBOUND_NETWORK_MODE:-direct}
      HTTP_PROXY: ${LUMANEST_OUTBOUND_PROXY_URL:-}
      HTTPS_PROXY: ${LUMANEST_OUTBOUND_PROXY_URL:-}
      NO_PROXY: 127.0.0.1,localhost,qweather-token-broker,context-service,redis,postgres
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8001"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - mihomo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  discovery-worker:
    build:
      context: ../lumanest-discovery-service
      dockerfile: ${DISCOVERY_WORKER_DOCKERFILE:-Dockerfile.crawler}
      args:
        DISCOVERY_BASE_IMAGE: ${DISCOVERY_BASE_IMAGE:-qweather-token-broker-context-service:latest}
    container_name: lumanest-discovery-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://lumanest:${LUMANEST_DATABASE_PASSWORD:?Set LUMANEST_DATABASE_PASSWORD}@postgres/lumanest
      REDIS_URL: redis://redis:6379/0
      DISCOVERY_BROKER_URL: http://qweather-token-broker:8787
      DISCOVERY_WORKER_TOKEN: ${DISCOVERY_WORKER_TOKEN:?Set DISCOVERY_WORKER_TOKEN}
      DISCOVERY_CRAWLER_ENABLED: ${DISCOVERY_CRAWLER_ENABLED:-false}
      DISCOVERY_CRAWLER_TIMEOUT_MS: ${DISCOVERY_CRAWLER_TIMEOUT_MS:-12000}
      LUMANEST_OUTBOUND_NETWORK_MODE: ${LUMANEST_OUTBOUND_NETWORK_MODE:-direct}
      HTTP_PROXY: ${LUMANEST_OUTBOUND_PROXY_URL:-}
      HTTPS_PROXY: ${LUMANEST_OUTBOUND_PROXY_URL:-}
      NO_PROXY: 127.0.0.1,localhost,qweather-token-broker,context-service,discovery-api,redis,postgres
    command: ["python", "-m", "app.worker"]
    shm_size: 512m
    mem_limit: 1536m
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - mihomo
    depends_on:
      qweather-token-broker:
        condition: service_healthy
      discovery-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from redis import Redis; assert Redis.from_url(os.environ['REDIS_URL'], decode_responses=True).get('discovery:worker:heartbeat') == 'ok'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  discovery-feed-worker:
    build: *discovery-api-build
    container_name: lumanest-discovery-feed-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://lumanest:${LUMANEST_DATABASE_PASSWORD:?Set LUMANEST_DATABASE_PASSWORD}@postgres/lumanest
      REDIS_URL: redis://redis:6379/0
      DISCOVERY_BROKER_URL: http://qweather-token-broker:8787
      DISCOVERY_WORKER_TOKEN: ${DISCOVERY_WORKER_TOKEN:?Set DISCOVERY_WORKER_TOKEN}
      DISCOVERY_FEED_SOURCES_JSON: ${DISCOVERY_FEED_SOURCES_JSON:-[]}
      DISCOVERY_FEED_CONCURRENCY: ${DISCOVERY_FEED_CONCURRENCY:-3}
      DISCOVERY_FEED_POLL_SECONDS: ${DISCOVERY_FEED_POLL_SECONDS:-30}
      LUMANEST_OUTBOUND_NETWORK_MODE: ${LUMANEST_OUTBOUND_NETWORK_MODE:-direct}
      HTTP_PROXY: ${LUMANEST_OUTBOUND_PROXY_URL:-}
      HTTPS_PROXY: ${LUMANEST_OUTBOUND_PROXY_URL:-}
      NO_PROXY: 127.0.0.1,localhost,qweather-token-broker,context-service,discovery-api,redis,postgres
    command: ["python", "-m", "app.feed_worker"]
    mem_limit: 384m
    pids_limit: 96
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - mihomo
    depends_on:
      qweather-token-broker:
        condition: service_healthy
      discovery-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from redis import Redis; assert Redis.from_url(os.environ['REDIS_URL'], decode_responses=True).get('discovery:feed-worker:heartbeat') == 'ok'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgis/postgis:17-3.5
    platform: ${POSTGIS_PLATFORM:-linux/amd64}
    container_name: lumanest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lumanest
      POSTGRES_USER: lumanest
      POSTGRES_PASSWORD: ${LUMANEST_DATABASE_PASSWORD:?Set LUMANEST_DATABASE_PASSWORD}
    volumes:
      - lumanest-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumanest -d lumanest"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: lumanest-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - lumanest-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  outbound-network-controller:
    build:
      context: .
      dockerfile: Dockerfile.network-controller
    container_name: lumanest-outbound-network-controller
    restart: unless-stopped
    environment:
      PORT: "8790"
      LUMANEST_NETWORK_CONTROLLER_TOKEN: ${LUMANEST_NETWORK_CONTROLLER_TOKEN:?Set LUMANEST_NETWORK_CONTROLLER_TOKEN}
      LUMANEST_HOST_ROOT: /lumanest-root
      LUMANEST_HOST_RELEASE_PREFIX: ${LUMANEST_HOST_RELEASE_PREFIX:-/vol2/docker/lumanest}
      LUMANEST_COMPOSE_PROJECT: ${PROJECT_NAME:-qweather-token-broker}
      LUMANEST_MIHOMO_PROXY_URL: ${LUMANEST_MIHOMO_PROXY_URL:-http://mihomo:7890}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${LUMANEST_HOST_ROOT:-/vol2/docker/lumanest}:/lumanest-root:rw
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - default

volumes:
  lumanest-data:
  lumanest-postgres:
  lumanest-redis:

networks:
  default: {}
  mihomo:
    external: true
    name: ${LUMANEST_MIHOMO_NETWORK:-mihomo_default}
