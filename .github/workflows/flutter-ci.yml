name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification-pending:
    name: Publish pending verification status
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Mark combined verification pending
        uses: actions/github-script@v7
        with:
          script: |
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const targetSha = context.eventName === 'pull_request'
              ? context.payload.pull_request.head.sha
              : context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: targetSha,
              state: 'pending',
              context: 'LumaNest / verification',
              description: 'Flutter and service verification is running',
              target_url: targetUrl,
            });

  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

  data-broker:
    name: Test data broker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/lumanest-data-broker/package-lock.json

      - name: Install data broker dependencies
        working-directory: services/lumanest-data-broker
        run: npm ci

      - name: Run data broker tests
        working-directory: services/lumanest-data-broker
        run: npm test

  context-service:
    name: Test context service
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/lumanest-context-service/pyproject.toml

      - name: Install context service dependencies
        working-directory: services/lumanest-context-service
        run: pip install -e '.[test]'

      - name: Run context service tests
        working-directory: services/lumanest-context-service
        run: pytest -q --tb=short

  discovery-service:
    name: Test discovery service
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/lumanest-discovery-service/pyproject.toml

      - name: Install discovery service dependencies
        working-directory: services/lumanest-discovery-service
        run: pip install -e '.[test]'

      - name: Run discovery service tests
        working-directory: services/lumanest-discovery-service
        run: pytest -q --tb=short

  raster-service:
    name: Test raster service
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/lumanest-raster-service/pyproject.toml

      - name: Install raster service dependencies
        working-directory: services/lumanest-raster-service
        run: pip install -e '.[test]'

      - name: Run raster service tests
        working-directory: services/lumanest-raster-service
        run: pytest

  terrain-service:
    name: Test terrain service
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/lumanest-terrain-service/pyproject.toml

      - name: Install terrain service dependencies
        working-directory: services/lumanest-terrain-service
        run: pip install -e '.[test]'

      - name: Run terrain service tests
        working-directory: services/lumanest-terrain-service
        run: pytest

  contract-drift:
    name: Check shared contracts and generated mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The catalog is authored once and mirrored into Dart, Python and Node.
      # The generators have a --check mode that no suite calls, so a regenerated
      # catalog could otherwise merge with one mirror left behind.
      - name: Verify generated catalog mirrors are current
        run: python3 tool/generate_catalog.py --check

      # contract/context-v5.* is the single source for the numbers each language
      # restates; these tests read it from their own layer, so a partial contract
      # change fails here rather than in a shipped client.
      - name: Check the V5 contract files are present and parseable
        run: python3 -c "import json;[json.load(open(p)) for p in ('contract/context-v5.snapshot.golden.json','contract/context-v5.policy.json')]"

  verification-status:
    name: Publish combined verification status
    if: always()
    needs:
      - quality
      - data-broker
      - context-service
      - discovery-service
      - raster-service
      - terrain-service
      - contract-drift
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Publish auditable commit status
        uses: actions/github-script@v7
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          DATA_BROKER_RESULT: ${{ needs['data-broker'].result }}
          CONTEXT_RESULT: ${{ needs['context-service'].result }}
          DISCOVERY_RESULT: ${{ needs['discovery-service'].result }}
          RASTER_RESULT: ${{ needs['raster-service'].result }}
          TERRAIN_RESULT: ${{ needs['terrain-service'].result }}
          CONTRACT_RESULT: ${{ needs['contract-drift'].result }}
        with:
          script: |
            const results = {
              flutter: process.env.QUALITY_RESULT,
              dataBroker: process.env.DATA_BROKER_RESULT,
              context: process.env.CONTEXT_RESULT,
              discovery: process.env.DISCOVERY_RESULT,
              raster: process.env.RASTER_RESULT,
              terrain: process.env.TERRAIN_RESULT,
              contract: process.env.CONTRACT_RESULT,
            };
            const failed = Object.entries(results)
              .filter(([, result]) => result !== 'success')
              .map(([name, result]) => `${name}:${result}`);
            const state = failed.length === 0 ? 'success' : 'failure';
            const description = state === 'success'
              ? 'Flutter and service verification passed'
              : `Verification failed: ${failed.join(', ')}`.slice(0, 140);
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const targetSha = context.eventName === 'pull_request'
              ? context.payload.pull_request.head.sha
              : context.sha;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: targetSha,
              state,
              context: 'LumaNest / verification',
              description,
              target_url: targetUrl,
            });

            await core.summary
              .addHeading('LumaNest verification')
              .addTable([
                [{ data: 'Gate', header: true }, { data: 'Result', header: true }],
                ...Object.entries(results).map(([name, result]) => [name, result]),
              ])
              .write();

            if (state === 'failure') {
              core.setFailed(description);
            }
