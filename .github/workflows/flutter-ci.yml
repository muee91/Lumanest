name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      upload_apk:
        description: Upload the debug APK for temporary manual download
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

  data-broker:
    name: Test data broker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/lumanest-data-broker/package-lock.json

      - name: Install data broker dependencies
        working-directory: services/lumanest-data-broker
        run: npm ci

      - name: Run data broker tests
        working-directory: services/lumanest-data-broker
        run: npm test

  discovery-service:
    name: Test discovery service
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/lumanest-discovery-service/pyproject.toml

      - name: Install discovery service dependencies
        working-directory: services/lumanest-discovery-service
        run: pip install -e '.[test]'

      - name: Run discovery service tests
        shell: bash
        working-directory: services/lumanest-discovery-service
        run: |
          set +e
          pytest -q --tb=short > discovery-test.log 2>&1
          status=$?
          cat discovery-test.log
          exit "$status"

      - name: Upload failed discovery test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-test-log-${{ github.sha }}
          path: services/lumanest-discovery-service/discovery-test.log
          if-no-files-found: error
          retention-days: 2

  raster-service:
    name: Test raster service
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/lumanest-raster-service/pyproject.toml

      - name: Install raster service dependencies
        working-directory: services/lumanest-raster-service
        run: pip install -e '.[test]'

      - name: Run raster service tests
        working-directory: services/lumanest-raster-service
        run: pytest

  terrain-service:
    name: Test terrain service
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/lumanest-terrain-service/pyproject.toml

      - name: Install terrain service dependencies
        working-directory: services/lumanest-terrain-service
        run: pip install -e '.[test]'

      - name: Run terrain service tests
        working-directory: services/lumanest-terrain-service
        run: pytest

  android-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK for manual runs only
        if: github.event_name == 'workflow_dispatch' && inputs.upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: lumanest-debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 2
