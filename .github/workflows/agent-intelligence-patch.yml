name: Agent intelligence patch

on:
  push:
    branches:
      - agent/unified-intelligence-surface
    paths:
      - .github/agent-intelligence-patch.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-intelligence-surface
      - name: Apply deterministic source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/src/presentation_v2/intelligence/v2_intelligence_page.dart')
          text = path.read_text()

          replacements = {
              "  String? _pendingFallback;\n": "",
              "                    compact: inspirationHeight <= 128,": "                    compact: inspirationHeight <= 190,",
              "                    onSubmit: _submitText,\n                    onSuggestion: _ask,": "                    onSubmit: _submitText,\n                    onInputChanged: () => setState(() {}),\n                    onSuggestion: _ask,",
              "        automatic: true,\n": "",
              "    bool automatic = false,\n": "",
              "      _pendingFallback = fallback;\n": "",
              "    _pendingFallback = null;\n": "",
              "    required this.onSubmit,\n    required this.onSuggestion,": "    required this.onSubmit,\n    required this.onInputChanged,\n    required this.onSuggestion,",
              "  final VoidCallback onSubmit;\n  final ValueChanged<String> onSuggestion;": "  final VoidCallback onSubmit;\n  final VoidCallback onInputChanged;\n  final ValueChanged<String> onSuggestion;",
              "                onChanged: (_) => (context as Element).markNeedsBuild(),": "                onChanged: (_) => onInputChanged(),",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected source fragment: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)

          Path('.github/workflows/agent-intelligence-patch.yml').unlink()
          Path('.github/agent-intelligence-patch.trigger').unlink()
          PY
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize intelligence input layout"
          git push origin HEAD:agent/unified-intelligence-surface
