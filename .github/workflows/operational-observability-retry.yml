name: Retry operational observability patch

on:
  push:
    paths:
      - .github/workflows/operational-observability-retry.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Repair anchor and execute patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          workflow = Path('.github/workflows/operational-observability-once.yml').read_text(encoding='utf-8')
          workflow = workflow.replace(
              "calibration:['反馈校准','查看拍摄反馈样本与规则表现。'],",
              "calibration:['反馈校准','查看达到隐私阈值的匿名拍摄反馈聚合。'],",
          )
          marker = "          python3 - <<'PY'\n"
          body = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          script = textwrap.dedent(body)
          Path('/tmp/apply_operational_observability.py').write_text(script, encoding='utf-8')
          subprocess.run(['python3', '/tmp/apply_operational_observability.py'], check=True)
          Path('.github/workflows/operational-observability-retry.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add bounded operational observability"
          git push origin HEAD:main
