name: Agent failure context diagnostics

on:
  push:
    branches:
      - agent/unified-intelligence-surface
    paths:
      - .github/agent-failure-context.trigger

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-intelligence-surface
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Extract failure contexts
        run: |
          set +e
          flutter test --reporter expanded > /tmp/full-test.txt 2>&1
          status=$?
          printf '%s' "$status" > /tmp/status
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/full-test.txt').read_text(errors='replace').splitlines()
          markers = [i for i, line in enumerate(lines) if 'EXCEPTION CAUGHT BY FLUTTER TEST FRAMEWORK' in line]
          out = [f'FULL_TEST_EXIT={Path("/tmp/status").read_text().strip()}', f'EXCEPTIONS={len(markers)}']
          for number, index in enumerate(markers, 1):
              out.append(f'\n===== EXCEPTION {number} =====')
              start = max(0, index - 35)
              end = min(len(lines), index + 50)
              out.extend(f'{i + 1}: {lines[i]}' for i in range(start, end))
          if not markers:
              out.extend(lines[-200:])
          Path('.github/intelligence-failure-context.txt').write_text('\n'.join(out) + '\n')
          PY
          rm .github/workflows/agent-failure-context.yml
          rm .github/agent-failure-context.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .github/intelligence-failure-context.txt
          git add -u
          git commit -m "chore: capture full test failure contexts"
          git push origin HEAD:agent/unified-intelligence-surface
