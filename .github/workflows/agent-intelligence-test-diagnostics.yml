name: Agent intelligence test diagnostics

on:
  push:
    branches:
      - agent/unified-intelligence-surface
    paths:
      - .github/agent-intelligence-test-diagnostics.trigger

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-intelligence-surface
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Capture targeted test output
        run: |
          set +e
          flutter test test/presentation_v2/intelligence/v2_intelligence_page_test.dart --reporter expanded > .github/intelligence-test.txt 2>&1
          status=$?
          printf '\nTEST_EXIT=%s\n' "$status" >> .github/intelligence-test.txt
          rm .github/workflows/agent-intelligence-test-diagnostics.yml
          rm .github/agent-intelligence-test-diagnostics.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .github/intelligence-test.txt
          git add -u
          git commit -m "chore: capture intelligence test diagnostics"
          git push origin HEAD:agent/unified-intelligence-surface
