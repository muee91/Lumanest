name: Agent intelligence overlay lifecycle patch

on:
  push:
    branches:
      - agent/unified-intelligence-surface
    paths:
      - .github/agent-intelligence-overlay-fix.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-intelligence-surface
      - name: Apply deterministic overlay lifecycle patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('lib/src/app/luma_nest_app.dart')
          text = app.read_text()
          import_anchor = "import 'package:luma_nest/src/features/sky_opportunity/presentation/sky_opportunity_ambient.dart';\n"
          import_line = "import 'package:luma_nest/src/presentation_v2/intelligence/intelligence_overlay_state.dart';\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('app import anchor missing')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          build_anchor = "    final preferences = ref.watch(profilePreferencesProvider);\n"
          build_insert = (
              build_anchor
              + "    final intelligenceOverlayVisible = ref.watch(\n"
              + "      intelligenceOverlayVisibleProvider,\n"
              + "    );\n"
          )
          if "final intelligenceOverlayVisible = ref.watch(" not in text:
              if build_anchor not in text:
                  raise SystemExit('app build anchor missing')
              text = text.replace(build_anchor, build_insert, 1)

          ambient_old = (
              "              if (preferences.ambientBackgroundEnabled &&\n"
              "                  _routeLocation == '/today')\n"
          )
          ambient_new = (
              "              if (preferences.ambientBackgroundEnabled &&\n"
              "                  !intelligenceOverlayVisible &&\n"
              "                  _routeLocation == '/today')\n"
          )
          if ambient_old not in text:
              raise SystemExit('ambient visibility condition missing')
          text = text.replace(ambient_old, ambient_new, 1)
          app.write_text(text)

          page = Path('lib/src/presentation_v2/intelligence/v2_intelligence_page.dart')
          text = page.read_text()
          page_import_anchor = "import 'package:luma_nest/src/features/profile/application/profile_preferences_controller.dart';\n"
          page_import_line = "import 'package:luma_nest/src/presentation_v2/intelligence/intelligence_overlay_state.dart';\n"
          if page_import_line not in text:
              if page_import_anchor not in text:
                  raise SystemExit('intelligence import anchor missing')
              text = text.replace(
                  page_import_anchor,
                  page_import_anchor + page_import_line,
                  1,
              )

          return_old = "    return Scaffold(\n      key: const Key('v2-intelligence-page'),"
          return_new = (
              "    return _IntelligenceOverlayLifecycle(\n"
              "      child: Scaffold(\n"
              "        key: const Key('v2-intelligence-page'),"
          )
          if return_old not in text:
              raise SystemExit('intelligence scaffold return missing')
          text = text.replace(return_old, return_new, 1)

          close_old = "      ),\n    );\n  }\n\n  static void _close"
          close_new = "        ),\n      ),\n    );\n  }\n\n  static void _close"
          if close_old not in text:
              raise SystemExit('intelligence scaffold close missing')
          text = text.replace(close_old, close_new, 1)

          lifecycle_anchor = "\nenum _IntelligenceLayoutState { home, inspiration, conversation, typing }\n"
          lifecycle = r'''

class _IntelligenceOverlayLifecycle extends ConsumerStatefulWidget {
  const _IntelligenceOverlayLifecycle({required this.child});

  final Widget child;

  @override
  ConsumerState<_IntelligenceOverlayLifecycle> createState() =>
      _IntelligenceOverlayLifecycleState();
}

class _IntelligenceOverlayLifecycleState
    extends ConsumerState<_IntelligenceOverlayLifecycle> {
  @override
  void initState() {
    super.initState();
    WidgetsBinding.instance.addPostFrameCallback((_) {
      if (!mounted) return;
      ref.read(intelligenceOverlayVisibleProvider.notifier).show();
    });
  }

  @override
  void dispose() {
    ref.read(intelligenceOverlayVisibleProvider.notifier).hide();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) => widget.child;
}
'''
          if "class _IntelligenceOverlayLifecycle extends" not in text:
              if lifecycle_anchor not in text:
                  raise SystemExit('intelligence lifecycle anchor missing')
              text = text.replace(lifecycle_anchor, lifecycle + lifecycle_anchor, 1)
          page.write_text(text)

          Path('.github/intelligence-final-full.txt').unlink(missing_ok=True)
          Path('.github/workflows/agent-intelligence-overlay-fix.yml').unlink()
          Path('.github/agent-intelligence-overlay-fix.trigger').unlink()
          PY
      - name: Format and commit
        run: |
          dart format \
            lib/src/app/luma_nest_app.dart \
            lib/src/presentation_v2/intelligence/intelligence_overlay_state.dart \
            lib/src/presentation_v2/intelligence/v2_intelligence_page.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: suspend ambient rendering under intelligence"
          git push origin HEAD:agent/unified-intelligence-surface
