name: One-shot prune legacy inspiration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-prune-legacy-inspiration.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove legacy surface and Flutter Companion client are isolated
        shell: bash
        run: |
          set -euo pipefail

          page_refs="$(git grep -n -E 'V2InspirationPage|v2_inspiration_page' -- lib ':!lib/src/presentation_v2/inspiration/v2_inspiration_page.dart' || true)"
          if [ -n "$page_refs" ]; then
            echo 'Unexpected production references to legacy Inspiration page:'
            echo "$page_refs"
            exit 1
          fi

          companion_refs="$(git grep -n -E 'companion_client\.dart|CompanionInventoryController|companionInventoryProvider|DataBrokerCompanionRepository|CompanionRepository|CompanionInsight|InsightFeedbackAction|InsightChannel' -- lib ':!lib/src/core/companion/companion_client.dart' ':!lib/src/presentation_v2/inspiration/v2_inspiration_page.dart' || true)"
          if [ -n "$companion_refs" ]; then
            echo 'Unexpected production references to Flutter Companion client:'
            echo "$companion_refs"
            exit 1
          fi

          grep -q "path: '/intelligence'" lib/src/app/router.dart
          grep -q "path: '/inspiration'" lib/src/app/router.dart
          count="$(grep -c 'child: V2IntelligencePage(' lib/src/app/router.dart)"
          if [ "$count" -lt 2 ]; then
            echo 'Legacy /inspiration deep link is not yet routed through V2IntelligencePage.'
            exit 1
          fi

      - name: Remove dead Flutter surface and client
        shell: bash
        run: |
          set -euo pipefail
          rm lib/src/presentation_v2/inspiration/v2_inspiration_page.dart
          rm lib/src/core/companion/companion_client.dart
          rm test/presentation_v2/ai/v2_ai_entry_test.dart
          rm test/core/companion/companion_client_test.dart

          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/core-1.0-scope.md')
          text = path.read_text()
          old = '| Companion 自动 inventory/refresh | **退役** | 不允许无用户可见消费者的自动网络工作；后续删除残余实现 |'
          new = '| Companion 自动 inventory/refresh | **退役** | Flutter 旧 Inspiration 消费者与 Companion client 已删除；服务端仅保留仍被 assistant/context 快照链依赖的内部状态，禁止恢复 inventory UI 或自动刷新 |'
          if old not in text:
              raise SystemExit('Core scope Companion row changed unexpectedly')
          path.write_text(text.replace(old, new))
          PY

          rm -f .github/workflows/one-shot-prune-legacy-inspiration.yml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify prune
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git grep -n -E 'V2InspirationPage|v2_inspiration_page|companion_client\.dart|CompanionInventoryController|companionInventoryProvider|DataBrokerCompanionRepository' -- lib test; then
            echo 'Dead Flutter Inspiration/Companion references remain.'
            exit 1
          fi
          flutter analyze
          flutter test

      - name: Commit verified prune
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: remove legacy Inspiration Companion client'
          git pull --rebase origin main
          git push origin HEAD:main
