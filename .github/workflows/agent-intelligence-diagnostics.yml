name: Agent intelligence diagnostics

on:
  push:
    branches:
      - agent/unified-intelligence-surface
    paths:
      - .github/agent-intelligence-diagnostics.trigger

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-intelligence-surface
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Capture analyzer output
        run: |
          set +e
          flutter analyze --no-fatal-infos > .github/intelligence-analyze.txt 2>&1
          status=$?
          printf '\nANALYZE_EXIT=%s\n' "$status" >> .github/intelligence-analyze.txt
          rm .github/workflows/agent-intelligence-diagnostics.yml
          rm .github/agent-intelligence-diagnostics.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: capture intelligence analyzer diagnostics"
          git push origin HEAD:agent/unified-intelligence-surface
