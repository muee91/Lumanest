name: Apply site environment integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply integration patch
        run: python tool/apply_site_environment_patch.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/lumanest-data-broker/package-lock.json

      - name: Test data broker
        working-directory: services/lumanest-data-broker
        run: |
          npm ci
          npm test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/lumanest-raster-service/pyproject.toml

      - name: Test raster service
        working-directory: services/lumanest-raster-service
        run: |
          pip install -e '.[test]'
          pytest

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Analyze and test Flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test --reporter expanded

      - name: Commit directly to main
        run: |
          rm tool/apply_site_environment_patch.py
          rm .github/workflows/apply-site-environment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: connect DEM and VIIRS site facts"
          git push origin HEAD:main
