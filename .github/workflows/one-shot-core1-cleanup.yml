name: One-shot Core 1.0 cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-core1-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Apply Core 1.0 cleanup
        run: python3 .github/scripts/core1_scope_cleanup.py

      - name: Format touched Dart files
        run: dart format lib/src/app/router.dart lib/src/app/luma_nest_app.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Verify retired production wiring is gone
        run: |
          ! grep -q "V2EnvironmentTimelinePage" lib/src/app/router.dart
          ! grep -q "companionInventoryProvider" lib/src/app/luma_nest_app.dart
          grep -q "V2EnvironmentWorkbenchPage" lib/src/app/router.dart
          grep -q "CURRENT · PRODUCT SCOPE AUTHORITY" docs/core-1.0-scope.md

      - name: Remove one-shot scaffolding
        run: |
          rm -f .github/scripts/core1_scope_cleanup.py
          rm -f .github/workflows/one-shot-core1-cleanup.yml

      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: establish Core 1.0 product scope"
          git push origin HEAD:main
