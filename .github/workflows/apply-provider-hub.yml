name: Apply Provider Hub

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-provider-hub
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/provider-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/provider-hub
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python tool/apply_provider_hub_patch.py

      - name: Align GET repository test with query contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('test/infrastructure/environment/data_broker_provider_facts_repository_test.dart')
          source = path.read_text()
          source, count = re.subn(
              r"\s*final body = jsonDecode\(request\.body\) as Map<String, dynamic>;\s*expect\(body\.keys, \{'latitude', 'longitude', 'radiusKm', 'localOffsetMinutes'\}\);",
              "\n      expect(request.url.queryParameters.keys.toSet(), {\n        'latitude',\n        'longitude',\n        'radiusKm',\n        'localOffsetMinutes',\n      });",
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit('GET request-body assertion was not found exactly once')
          path.write_text(source)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/lumanest-data-broker/package-lock.json

      - name: Test data broker
        working-directory: services/lumanest-data-broker
        run: |
          npm ci
          npm test

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Format Flutter changes
        run: |
          dart format \
            lib/src/core/environment/provider_facts.dart \
            lib/src/core/environment/provider_facts_repository.dart \
            lib/src/core/environment/provider_facts_providers.dart \
            lib/src/infrastructure/environment/data_broker_provider_facts_repository.dart \
            lib/src/presentation_v2/explore/v2_provider_facts_sheet.dart \
            lib/src/presentation_v2/explore/v2_explore_page.dart \
            test/core/environment/provider_facts_test.dart \
            test/infrastructure/environment/data_broker_provider_facts_repository_test.dart \
            test/presentation_v2/explore/v2_provider_facts_sheet_test.dart

      - name: Analyze Flutter
        run: |
          flutter pub get
          flutter analyze

      - name: Test provider hub Flutter surface
        run: |
          flutter test --reporter expanded \
            test/core/environment/provider_facts_test.dart \
            test/infrastructure/environment/data_broker_provider_facts_repository_test.dart \
            test/presentation_v2/explore/v2_provider_facts_sheet_test.dart

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit implementation
        run: |
          rm -rf tool/provider_patch_parts
          rm tool/apply_provider_hub_patch.py
          rm .github/workflows/apply-provider-hub.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: connect supplementary provider hub"
          git push origin HEAD:agent/provider-hub
