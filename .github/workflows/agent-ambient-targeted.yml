name: Agent ambient lifecycle diagnostics

on:
  push:
    branches:
      - agent/unified-intelligence-surface
    paths:
      - .github/agent-ambient-targeted.trigger

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-intelligence-surface
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run ambient lifecycle test
        run: |
          set +e
          flutter test test/app/ambient_preferences_integration_test.dart --reporter expanded > .github/ambient-targeted.txt 2>&1
          status=$?
          printf '\nTARGETED_EXIT=%s\n' "$status" >> .github/ambient-targeted.txt
          rm .github/workflows/agent-ambient-targeted.yml
          rm .github/agent-ambient-targeted.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .github/ambient-targeted.txt
          git add -u
          git commit -m "chore: capture ambient lifecycle diagnostics"
          git push origin HEAD:agent/unified-intelligence-surface
