name: Provider operations closure

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.ref == 'agent/provider-operations-closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/lumanest-data-broker/package-lock.json
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - name: Apply production closure
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_provider_operations_closure.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              'if content.count(old) != 1:\n        raise RuntimeError',
              'if content.count(old) < 1:\n        raise RuntimeError',
              1,
          )
          path.write_text(source, encoding='utf-8')
          PY
          python tools/apply_provider_operations_closure.py
      - name: Format Dart sources
        run: dart format lib/src/core/environment/provider_signal_relevance.dart lib/src/presentation_v2/explore/v2_provider_facts_sheet.dart lib/src/presentation_v2/explore/v2_explore_page.dart test/core/environment/provider_signal_relevance_test.dart
      - name: Test Data Broker
        working-directory: services/lumanest-data-broker
        run: npm ci && npm test
      - name: Validate Flutter closure
        run: |
          flutter pub get
          flutter analyze
          flutter test test/core/environment/provider_signal_relevance_test.dart test/presentation_v2/explore/v2_provider_facts_sheet_test.dart
      - name: Remove one-time executor
        run: git rm .github/workflows/provider-operations-closure.yml tools/apply_provider_operations_closure.py
      - name: Commit generated implementation
        run: |
          git config user.name 'OpenAI Codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'feat: complete provider operations closure'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
