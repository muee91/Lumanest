name: Agent final failure tail

on:
  push:
    branches:
      - agent/unified-intelligence-surface
    paths:
      - .github/agent-final-failure-tail.trigger

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-intelligence-surface
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Capture failure details
        run: |
          set +e
          flutter test --reporter expanded > /tmp/full-test.txt 2>&1
          status=$?
          {
            printf 'FULL_TEST_EXIT=%s\n' "$status"
            printf '\n===== FAILING TESTS =====\n'
            grep -A 40 -F 'Failing tests:' /tmp/full-test.txt || true
            printf '\n===== EXCEPTIONS =====\n'
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/full-test.txt').read_text(errors='replace').splitlines()
          markers = [i for i, line in enumerate(lines) if 'EXCEPTION CAUGHT' in line]
          for number, index in enumerate(markers, 1):
              print(f'\n--- EXCEPTION {number} ---')
              for line in lines[max(0, index - 15):min(len(lines), index + 75)]:
                  print(line)
          PY
            printf '\n===== LAST 350 LINES =====\n'
            tail -n 350 /tmp/full-test.txt
          } > .github/final-failure-tail.txt
          rm .github/workflows/agent-final-failure-tail.yml
          rm .github/agent-final-failure-tail.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .github/final-failure-tail.txt
          git add -u
          git commit -m "chore: capture final failure details"
          git push origin HEAD:agent/unified-intelligence-surface
