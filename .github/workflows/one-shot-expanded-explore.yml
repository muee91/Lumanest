name: One-shot Expanded Explore

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-expanded-explore.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Patch explore presentation
        run: python3 tool/patch_expanded_explore.py
      - name: Commit product changes
        run: |
          rm .github/workflows/one-shot-expanded-explore.yml
          rm tool/patch_expanded_explore.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/presentation_v2/explore/v2_explore_page.dart .github/workflows/one-shot-expanded-explore.yml tool/patch_expanded_explore.py
          git commit -m "feat: expose active expanded exploration"
          git push
