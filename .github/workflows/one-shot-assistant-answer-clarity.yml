name: One-shot assistant answer clarity

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-assistant-answer-clarity.yml

permissions:
  contents: write

concurrency:
  group: one-shot-assistant-answer-clarity
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/lumanest-data-broker/package-lock.json

      - name: Correct patch anchors
        run: python3 .github/scripts/fix_assistant_answer_clarity_anchor.py

      - name: Apply product patch
        run: python3 .github/scripts/apply_assistant_answer_clarity.py

      - name: Format and inspect
        run: |
          dart format \
            lib/src/presentation_v2/intelligence/assistant_decision_summary.dart \
            lib/src/presentation_v2/intelligence/v2_intelligence_page.dart \
            test/presentation_v2/intelligence/assistant_decision_summary_test.dart \
            test/presentation_v2/intelligence/v2_intelligence_page_test.dart
          git diff --check

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter
        run: flutter analyze

      - name: Run assistant presentation tests
        run: |
          flutter test --reporter expanded \
            test/presentation_v2/intelligence/assistant_decision_summary_test.dart \
            test/presentation_v2/intelligence/v2_intelligence_page_test.dart \
            test/core/assistant/assistant_model_sse_test.dart \
            test/core/assistant/assistant_intent_test.dart

      - name: Test data broker
        working-directory: services/lumanest-data-broker
        run: |
          npm ci
          npm test

      - name: Remove one-shot machinery
        run: |
          rm .github/scripts/apply_assistant_answer_clarity.py
          rm .github/scripts/fix_assistant_answer_clarity_anchor.py
          rm .github/workflows/one-shot-assistant-answer-clarity.yml

      - name: Commit verified result
        run: |
          git config user.name 'muee91'
          git config user.email '55554607+muee91@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: surface key points in assistant answers'
          git push origin HEAD:main

# retry: assistant key point grouping corrected
