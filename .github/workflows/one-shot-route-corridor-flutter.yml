name: One-shot Flutter route corridor closure

on:
  push:
    paths:
      - .github/workflows/one-shot-route-corridor-flutter.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - name: Apply Flutter route corridor patch
        shell: bash
        run: |
          python3 .github/scripts/route_corridor_flutter_patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/features/route/route_scout_plan_test.dart')
          text = path.read_text(encoding='utf-8')
          text = text.replace('DrivingRoute _route() => const DrivingRoute(', 'DrivingRoute _route() => DrivingRoute(')
          text = text.replace('primaryScene: SceneType.road,', 'primaryScene: SceneType.city,')
          text = text.replace('  tollsYuan: 0,\n  polyline:', '  tollsYuan: 0.0,\n  polyline:')
          path.write_text(text, encoding='utf-8')
          PY
          dart format lib/src/features/route/domain/route_weather.dart \
            lib/src/features/route/domain/route_scout_plan.dart \
            lib/src/features/route/infrastructure/data_broker_route_weather_repository.dart \
            test/features/route/route_corridor_repository_test.dart \
            test/features/route/route_scout_plan_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Flutter
        run: flutter analyze
      - name: Test route corridor closure
        run: |
          flutter test test/features/route/data_broker_route_weather_repository_test.dart
          flutter test test/features/route/route_corridor_repository_test.dart
          flutter test test/features/route/route_scout_plan_test.dart
      - name: Commit Flutter route corridor closure
        shell: bash
        run: |
          rm .github/workflows/one-shot-route-corridor-flutter.yml
          rm .github/scripts/route_corridor_flutter_patch.py
          git config user.name "muee91"
          git config user.email "55554607+muee91@users.noreply.github.com"
          git add -A
          git commit -m "feat: surface official route restrictions"
          git push origin HEAD:main
