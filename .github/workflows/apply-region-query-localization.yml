name: Apply region query localization

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-region-query-localization.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch regional discovery chain
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}, found {text.count(old)}")
              file.write_text(text.replace(old, new, 1))

          region_identity = r'''import { wgs84ToGcj02 } from './deterministic.mjs';

const amapBaseUrl = 'https://restapi.amap.com';
const requestKeys = new Set(['region', 'locale']);
const regionKeys = new Set(['latitude', 'longitude', 'radiusMeters']);
const relevantType = /风景名胜|旅游景点|公园广场|自然地物|地名地址|行政区划|村庄|文化场馆|古镇|古村|景区/;
const genericName = /^(?:中国|中华人民共和国|当前区域|附近|未知|无名)$/;

function object(value) {
  return value != null && typeof value === 'object' && !Array.isArray(value);
}

function exactKeys(value, keys) {
  return object(value) && Object.keys(value).length === keys.size &&
    Object.keys(value).every((key) => keys.has(key));
}

function finite(value, minimum, maximum) {
  return typeof value === 'number' && Number.isFinite(value) && value >= minimum && value <= maximum;
}

function boundedText(value, maximum) {
  if (typeof value !== 'string') return null;
  const normalized = value.replace(/[\r\n\t]+/g, ' ').replace(/\s+/g, ' ').trim();
  return normalized.length > 0 && [...normalized].length <= maximum ? normalized : null;
}

function scalarText(value, maximum = 80) {
  if (Array.isArray(value)) return value.length === 1 ? boundedText(value[0], maximum) : null;
  return boundedText(value, maximum);
}

function distanceMeters(value) {
  const parsed = Number(value?.distance);
  return Number.isFinite(parsed) && parsed >= 0 ? parsed : Number.POSITIVE_INFINITY;
}

function addName(target, seen, value) {
  const name = scalarText(value);
  if (name == null || genericName.test(name) || seen.has(name)) return;
  seen.add(name);
  target.push(name);
}

export function validResolveRegionRequest(body) {
  return exactKeys(body, requestKeys) &&
    typeof body.locale === 'string' && /^[a-z]{2,3}(?:-[a-z0-9]{2,8})?$/i.test(body.locale) &&
    exactKeys(body.region, regionKeys) && finite(body.region.latitude, -90, 90) &&
    finite(body.region.longitude, -180, 180) && Number.isInteger(body.region.radiusMeters) &&
    finite(body.region.radiusMeters, 100, 50_000);
}

export function parseAmapRegionIdentity(payload) {
  if (payload?.status !== '1' || !object(payload.regeocode)) return null;
  const names = [];
  const seen = new Set();
  const candidates = [];
  for (const value of Array.isArray(payload.regeocode.aois) ? payload.regeocode.aois : []) {
    if (!object(value)) continue;
    const name = scalarText(value.name);
    const type = scalarText(value.type, 160) ?? '';
    const distance = distanceMeters(value);
    if (name != null && distance <= 500 && relevantType.test(`${name} ${type}`)) {
      candidates.push({ name, distance, priority: distance <= 100 ? 0 : 1 });
    }
  }
  for (const value of Array.isArray(payload.regeocode.pois) ? payload.regeocode.pois : []) {
    if (!object(value)) continue;
    const name = scalarText(value.name);
    const type = scalarText(value.type, 160) ?? '';
    const distance = distanceMeters(value);
    if (name != null && distance <= 300 && relevantType.test(`${name} ${type}`)) {
      candidates.push({ name, distance, priority: 2 });
    }
  }
  candidates
    .sort((left, right) => left.priority - right.priority || left.distance - right.distance || left.name.localeCompare(right.name))
    .forEach((item) => addName(names, seen, item.name));

  const address = object(payload.regeocode.addressComponent) ? payload.regeocode.addressComponent : {};
  addName(names, seen, address.township);
  addName(names, seen, address.district);
  addName(names, seen, address.city);
  addName(names, seen, address.province);
  const formatted = scalarText(payload.regeocode.formatted_address, 160);
  if (names.length === 0 && formatted != null) addName(names, seen, formatted);
  if (names.length === 0) return null;
  return Object.freeze({
    displayName: names[0],
    searchNames: Object.freeze(names.slice(0, 5)),
    source: Object.freeze({
      sourceId: 'amap-regeocode',
      publisher: '高德地图',
      version: 'amap-web-service-v1',
    }),
  });
}

export async function resolveRegionIdentity({ body, amapWebKey, fetcher = fetch, timeoutMs = 8_000 }) {
  if (!amapWebKey) return { status: 'failed' };
  const center = wgs84ToGcj02(body.region.latitude, body.region.longitude);
  const url = new URL('/v3/geocode/regeo', amapBaseUrl);
  url.searchParams.set('location', `${center.longitude.toFixed(6)},${center.latitude.toFixed(6)}`);
  url.searchParams.set('radius', String(Math.min(body.region.radiusMeters, 3_000)));
  url.searchParams.set('extensions', 'all');
  url.searchParams.set('roadlevel', '1');
  url.searchParams.set('key', amapWebKey);
  try {
    const upstream = await fetcher(url, { signal: AbortSignal.timeout(timeoutMs) });
    const payload = await upstream.json();
    const identity = upstream.ok ? parseAmapRegionIdentity(payload) : null;
    return identity == null ? { status: 'not_found' } : { status: 'resolved', ...identity };
  } catch {
    return { status: 'failed' };
  }
}
'''
          Path('services/lumanest-data-broker/src/discovery/region-identity.mjs').write_text(region_identity)

          region_test = r'''import assert from 'node:assert/strict';
import test from 'node:test';

import {
  parseAmapRegionIdentity,
  resolveRegionIdentity,
  validResolveRegionRequest,
} from '../src/discovery/region-identity.mjs';

const request = {
  region: { latitude: 30.275, longitude: 120.125, radiusMeters: 5000 },
  locale: 'zh-CN',
};

test('region identity request accepts only a bounded coarse region', () => {
  assert.equal(validResolveRegionRequest(request), true);
  assert.equal(validResolveRegionRequest({ ...request, userId: 'forbidden' }), false);
  assert.equal(validResolveRegionRequest({ ...request, region: { ...request.region, radiusMeters: 99 } }), false);
});

test('AMap region identity prefers containing reviewed place hints and keeps administrative fallbacks', () => {
  const parsed = parseAmapRegionIdentity({
    status: '1',
    regeocode: {
      formatted_address: '浙江省杭州市西湖区北山街道',
      addressComponent: {
        township: '北山街道', district: '西湖区', city: '杭州市', province: '浙江省',
      },
      aois: [
        { name: '远处商业中心', type: '商务住宅', distance: '2000' },
        { name: '西湖风景名胜区', type: '风景名胜;风景名胜相关;旅游景点', distance: '20' },
      ],
      pois: [
        { name: '北山街历史文化街区', type: '地名地址;普通地名;街道级地名', distance: '120' },
      ],
    },
  });
  assert.equal(parsed?.displayName, '西湖风景名胜区');
  assert.deepEqual(parsed?.searchNames, [
    '西湖风景名胜区', '北山街历史文化街区', '北山街道', '西湖区', '杭州市',
  ]);
});

test('region resolver uses AMap reverse geocoding without exposing an app request coordinate', async () => {
  let requested;
  const result = await resolveRegionIdentity({
    body: request,
    amapWebKey: 'amap-key',
    fetcher: async (url) => {
      requested = url;
      return new Response(JSON.stringify({
        status: '1',
        regeocode: {
          addressComponent: { district: '西湖区', city: '杭州市', province: '浙江省' },
          aois: [], pois: [],
        },
      }));
    },
  });
  assert.equal(result.status, 'resolved');
  assert.equal(requested.pathname, '/v3/geocode/regeo');
  assert.equal(requested.searchParams.get('extensions'), 'all');
  assert.equal(requested.searchParams.get('radius'), '3000');
});
'''
          Path('services/lumanest-data-broker/test/discovery-region-identity.test.mjs').write_text(region_test)

          replace_once(
              'services/lumanest-data-broker/src/server.mjs',
              "import { resolvePlace, validResolvePlaceRequest } from './discovery/geocode.mjs';",
              "import { resolvePlace, validResolvePlaceRequest } from './discovery/geocode.mjs';\nimport { resolveRegionIdentity, validResolveRegionRequest } from './discovery/region-identity.mjs';",
          )
          replace_once(
              'services/lumanest-data-broker/src/server.mjs',
              "        requestUrl.pathname === '/internal/v1/discovery/deterministic' ||\n        requestUrl.pathname === '/internal/v1/discovery/resolve-place') {",
              "        requestUrl.pathname === '/internal/v1/discovery/deterministic' ||\n        requestUrl.pathname === '/internal/v1/discovery/resolve-place' ||\n        requestUrl.pathname === '/internal/v1/discovery/resolve-region') {",
          )
          replace_once(
              'services/lumanest-data-broker/src/server.mjs',
              "      const body = await readJsonBody(request, requestUrl.pathname.endsWith('/search') || requestUrl.pathname.endsWith('/resolve-place') ? 4_096 : 16 * 1_024);",
              "      const body = await readJsonBody(request, requestUrl.pathname.endsWith('/search') || requestUrl.pathname.endsWith('/resolve-place') || requestUrl.pathname.endsWith('/resolve-region') ? 4_096 : 16 * 1_024);",
          )
          marker = "      if (requestUrl.pathname.endsWith('/resolve-place')) {\n"
          region_branch = """      if (requestUrl.pathname.endsWith('/resolve-region')) {
        if (body == null || !validResolveRegionRequest(body)) {
          writeJson(response, 400, { error: 'invalid_discovery_resolve_region_request' });
          return;
        }
        const result = await resolveRegionIdentity({
          body,
          amapWebKey: configuration.amapWebKey,
          fetcher,
          timeoutMs: configuration.settings.upstreamTimeoutMs,
        });
        writeJson(response, result.status === 'failed' && !configuration.amapWebKey ? 503 : 200, result);
        return;
      }
"""
          replace_once('services/lumanest-data-broker/src/server.mjs', marker, region_branch + marker)

          worker = Path('services/lumanest-discovery-service/app/worker.py')
          text = worker.read_text()
          text = text.replace(
              "    async def search(self, job: RefreshJob) -> list[BrokerSearchResult]:\n",
              "    async def resolve_region(self, job: RefreshJob) -> tuple[str, ...]:\n        payload = {\n            \"region\": {\n                \"latitude\": job.region.latitude,\n                \"longitude\": job.region.longitude,\n                \"radiusMeters\": job.region.radius_meters,\n            },\n            \"locale\": job.region.locale,\n        }\n        try:\n            raw = await self._post(\"/internal/v1/discovery/resolve-region\", payload)\n        except BrokerFailure:\n            return ()\n        if not isinstance(raw, dict) or raw.get(\"status\") != \"resolved\":\n            return ()\n        values = raw.get(\"searchNames\")\n        if not isinstance(values, list):\n            return ()\n        names: list[str] = []\n        for value in values:\n            if not isinstance(value, str):\n                continue\n            normalized = \" \".join(value.split()).strip()\n            if normalized and len(normalized) <= 80 and normalized not in names:\n                names.append(normalized)\n            if len(names) == 5:\n                break\n        return tuple(names)\n\n    async def search(\n        self,\n        job: RefreshJob,\n        region_names: tuple[str, ...] = (),\n    ) -> list[BrokerSearchResult]:\n",
              1,
          )
          text = text.replace("        for query in self._queries(job):\n", "        for query in self._queries(job, region_names):\n", 1)
          text = text.replace(
              "        evidence: list[BrokerSearchResult],\n    ) -> tuple[list[ExtractedCandidate], list[ExtractedRegionInsight]]:\n        payload = {\n            \"missionType\": job.region.mission_type,\n            \"focus\": job.region.focus,\n",
              "        evidence: list[BrokerSearchResult],\n        region_names: tuple[str, ...] = (),\n    ) -> tuple[list[ExtractedCandidate], list[ExtractedRegionInsight]]:\n        payload = {\n            \"missionType\": job.region.mission_type,\n            \"focus\": self._localized_focus(job, region_names),\n",
              1,
          )
          old_queries = '''    @staticmethod
    def _queries(job: RefreshJob) -> tuple[str, str, str]:
        # Coordinates are the coarse grid centre, never the app's raw point.
        area = job.region.focus.strip() or f"{job.region.latitude:.3f},{job.region.longitude:.3f}"
'''
          new_queries = '''    @staticmethod
    def _localized_focus(job: RefreshJob, region_names: tuple[str, ...] = ()) -> str:
        focus = " ".join(job.region.focus.split()).strip()
        generic = focus in {"区域探索资料", "regional exploration material"}
        if region_names:
            prefix = " ".join(region_names[:3])
            return prefix if generic or not focus else f"{prefix} {focus}"
        if generic or not focus:
            return f"{job.region.latitude:.3f},{job.region.longitude:.3f}附近"
        return focus

    @staticmethod
    def _queries(
        job: RefreshJob,
        region_names: tuple[str, ...] = (),
    ) -> tuple[str, str, str]:
        # The worker receives only a short-lived coarse grid centre. AMap names
        # are search hints, not product facts; published identity still requires
        # reviewed source evidence during extraction and admission.
        area = BrokerClient._localized_focus(job, region_names)
'''
          if text.count(old_queries) != 1:
              raise SystemExit('worker query block mismatch')
          text = text.replace(old_queries, new_queries, 1)
          old_process = '''        else:
            evidence = await broker.search(job)
            if not evidence:
'''
          new_process = '''        else:
            region_names: tuple[str, ...] = ()
            if isinstance(broker, BrokerClient):
                region_names = await broker.resolve_region(job)
                evidence = await broker.search(job, region_names)
                localized_focus = broker._localized_focus(job, region_names)
            else:
                evidence = await broker.search(job)
                localized_focus = job.region.focus
            if not evidence:
'''
          if text.count(old_process) != 1:
              raise SystemExit('worker process search block mismatch')
          text = text.replace(old_process, new_process, 1)
          text = text.replace("                focus=job.region.focus,\n", "                focus=localized_focus,\n", 1)
          text = text.replace(
              "                    job,\n                    selected,\n                )\n",
              "                    job,\n                    selected,\n                    region_names,\n                )\n",
              1,
          )
          worker.write_text(text)

          test_worker = Path('services/lumanest-discovery-service/tests/test_worker.py')
          tests = test_worker.read_text()
          insertion = r'''

def test_region_identity_localizes_brief_search_and_extraction_focus():
    queries = BrokerClient._queries(job(), ("西湖风景名胜区", "北山街道", "西湖区"))
    assert all("西湖风景名胜区" in query for query in queries)
    assert all("区域探索资料" not in query for query in queries)
    assert BrokerClient._localized_focus(job(), ()) == "30.275,120.125附近"


@pytest.mark.asyncio
async def test_region_identity_resolution_uses_only_the_coarse_job_reference(monkeypatch):
    captured = {}

    async def post(_self, path, payload):
        captured["path"] = path
        captured["payload"] = payload
        return {
            "status": "resolved",
            "displayName": "西湖风景名胜区",
            "searchNames": ["西湖风景名胜区", "北山街道", "西湖区"],
        }

    monkeypatch.setattr(BrokerClient, "_post", post)
    names = await BrokerClient("https://broker.test", "token").resolve_region(job())

    assert names == ("西湖风景名胜区", "北山街道", "西湖区")
    assert captured["path"] == "/internal/v1/discovery/resolve-region"
    assert captured["payload"]["region"] == {
        "latitude": 30.275,
        "longitude": 120.125,
        "radiusMeters": 5000,
    }
'''
          anchor = "\ndef test_job_contains_only_expiring_grid_center_not_the_request_coordinate():\n"
          if tests.count(anchor) != 1:
              raise SystemExit('worker test insertion anchor mismatch')
          tests = tests.replace(anchor, insertion + anchor, 1)
          test_worker.write_text(tests)
          PY

      - name: Validate data broker
        working-directory: services/lumanest-data-broker
        run: |
          npm ci
          npm test

      - name: Validate discovery Python syntax
        run: python -m compileall services/lumanest-discovery-service/app services/lumanest-discovery-service/tests

      - name: Commit directly to main
        shell: bash
        run: |
          rm .github/workflows/apply-region-query-localization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: localize regional discovery queries"
          git push origin HEAD:main
