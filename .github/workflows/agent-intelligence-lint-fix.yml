name: Agent intelligence lint fix

on:
  push:
    branches:
      - agent/unified-intelligence-surface
    paths:
      - .github/agent-intelligence-lint-fix.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-intelligence-surface
      - name: Apply lint fix and cleanup diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/src/presentation_v2/intelligence/v2_intelligence_page.dart')
          text = path.read_text()
          old = "      if (note?.opportunityId case final id?) id,"
          new = "      ?note?.opportunityId,"
          if old not in text:
              raise SystemExit('expected opportunity id collection element not found')
          path.write_text(text.replace(old, new, 1))
          Path('.github/intelligence-analyze.txt').unlink(missing_ok=True)
          Path('.github/workflows/agent-intelligence-lint-fix.yml').unlink()
          Path('.github/agent-intelligence-lint-fix.trigger').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: satisfy intelligence collection lint"
          git push origin HEAD:agent/unified-intelligence-surface
