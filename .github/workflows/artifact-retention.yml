name: Artifact Purge

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/artifact-retention.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: artifact-purge
  cancel-in-progress: true

jobs:
  purge:
    name: Remove all workflow artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Delete all artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 },
            );

            let deleted = 0;
            let releasedBytes = 0;

            for (const artifact of artifacts) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id,
                });
                deleted += 1;
                releasedBytes += artifact.size_in_bytes ?? 0;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            const releasedMiB = (releasedBytes / 1024 / 1024).toFixed(1);
            core.notice(
              `Artifact purge deleted ${deleted} item(s), releasing approximately ${releasedMiB} MiB.`,
            );
            await core.summary
              .addHeading('Artifact purge')
              .addTable([
                [{ data: 'Artifacts scanned', header: true }, String(artifacts.length)],
                [{ data: 'Artifacts deleted', header: true }, String(deleted)],
                [{ data: 'Approx. released', header: true }, `${releasedMiB} MiB`],
              ])
              .write();
