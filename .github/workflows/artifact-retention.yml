name: Artifact Retention

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches:
      - main
    paths:
      - .github/workflows/artifact-retention.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: artifact-retention
  cancel-in-progress: true

jobs:
  cleanup:
    name: Remove obsolete workflow artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Delete obsolete artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const purgeAll = context.eventName === 'push';
            const maxAgeHours = 48;
            const cutoff = Date.now() - maxAgeHours * 60 * 60 * 1000;

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 },
            );

            const obsolete = artifacts.filter((artifact) => {
              if (purgeAll || artifact.expired) return true;
              const createdAt = Date.parse(artifact.created_at);
              return Number.isFinite(createdAt) && createdAt < cutoff;
            });

            let deleted = 0;
            let releasedBytes = 0;

            for (const artifact of obsolete) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id,
                });
                deleted += 1;
                releasedBytes += artifact.size_in_bytes ?? 0;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            const releasedMiB = (releasedBytes / 1024 / 1024).toFixed(1);
            core.notice(
              `Artifact cleanup deleted ${deleted} item(s), releasing approximately ${releasedMiB} MiB.`,
            );
            await core.summary
              .addHeading('Artifact retention')
              .addTable([
                [{ data: 'Mode', header: true }, purgeAll ? 'Initial purge' : 'Rolling cleanup'],
                [{ data: 'Artifacts scanned', header: true }, String(artifacts.length)],
                [{ data: 'Artifacts deleted', header: true }, String(deleted)],
                [{ data: 'Approx. released', header: true }, `${releasedMiB} MiB`],
                [{ data: 'Rolling retention', header: true }, `${maxAgeHours} hours`],
              ])
              .write();
