name: Inspect environment visualization chain

on:
  push:
    branches:
      - agent/environment-visualization-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Locate cloud and remote context contracts
        shell: bash
        run: |
          set -euo pipefail
          echo '=== server integration references ==='
          grep -nE 'OpenMeteoNightSkyForecast|forwardContextSnapshot|authoritativeWeather|nightSky' services/lumanest-data-broker/src/server.mjs || true
          echo '=== context response models ==='
          grep -nE 'class Weather|class Context|weather:' services/lumanest-context-service/app/models.py | head -80 || true
          echo '=== context evaluate response construction ==='
          grep -RInE 'WeatherState|environment=.*weather|cloud_cover_percent|cloudCoverPercent' services/lumanest-context-service/app | head -160 || true
          echo '=== Dart context parsing and validation ==='
          sed -n '430,505p' lib/src/infrastructure/context/data_broker_context_repository.dart
          sed -n '1090,1150p' lib/src/infrastructure/context/data_broker_context_repository.dart
          echo '=== cache contract ==='
          sed -n '85,215p' lib/src/core/context/persistent_context_cache.dart
