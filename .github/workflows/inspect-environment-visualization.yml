name: Inspect environment visualization chain

on:
  push:
    branches:
      - agent/environment-visualization-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Locate environment visualization anchors
        shell: bash
        run: |
          set -euo pipefail
          echo '=== sky-window client usage ==='
          grep -RInE --exclude-dir=.git 'SkyWindowForecast|skyWindowForecast|sky_window' lib test | head -240 || true
          echo '=== sky-window providers and repositories ==='
          find lib test -type f \( -iname '*sky*window*' -o -iname '*environment*provider*' \) | sort
          echo '=== Today tests ==='
          find test/presentation_v2/today -type f -maxdepth 2 -print -exec sed -n '1,120p' {} \;
          echo '=== server context route anchors ==='
          sed -n '1260,1325p' services/lumanest-data-broker/src/server.mjs
          sed -n '2150,2215p' services/lumanest-data-broker/src/server.mjs
