name: One-shot ecology provider integration

on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/ecology_provider_patch.py
      - .github/workflows/one-shot-ecology-provider.yml

permissions:
  contents: write

concurrency:
  group: one-shot-ecology-provider
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/lumanest-data-broker/package-lock.json
      - name: Disambiguate repeated test fixture
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('services/lumanest-data-broker/test/provider-facts-service.test.mjs')
          text = path.read_text(encoding='utf-8')
          old = "    gbifBaseUrl: 'https://gbif.test',\n    ebirdBaseUrl:"
          new = "    gbifBaseUrl: 'https://gbif.test',\n    inaturalistBaseUrl: 'https://inaturalist.test',\n    ebirdBaseUrl:"
          if text.count(old) != 2:
              raise SystemExit(f'expected two repeated GBIF fixtures, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply ecology provider integration
        run: python3 .github/scripts/ecology_provider_patch.py
      - name: Explicitly enable eBird in adapter coverage test
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('services/lumanest-data-broker/test/provider-facts-service.test.mjs')
          text = path.read_text(encoding='utf-8')
          old = "  const service = new ProviderFactsService({\n    fetcher,\n    now: () => instant,\n    sentinelStacBaseUrl: 'https://stac.test/v1',\n"
          new = "  const service = new ProviderFactsService({\n    fetcher,\n    now: () => instant,\n    configuration: () => ({ enabledProviders: [...supportedProviderIds] }),\n    sentinelStacBaseUrl: 'https://stac.test/v1',\n"
          if text.count(old) != 1:
              raise SystemExit(f'adapter coverage anchor mismatch: {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Install data broker dependencies
        working-directory: services/lumanest-data-broker
        run: npm ci
      - name: Test full data broker suite
        working-directory: services/lumanest-data-broker
        run: npm test
      - name: Commit ecology provider integration
        run: |
          rm .github/scripts/ecology_provider_patch.py
          rm .github/workflows/one-shot-ecology-provider.yml
          git config user.name "muee91"
          git config user.email "55554607+muee91@users.noreply.github.com"
          git add -A
          git commit -m "feat: add privacy-safe ecology providers"
          git push origin HEAD:main
