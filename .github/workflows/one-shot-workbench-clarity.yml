name: One-shot environment workbench clarity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-workbench-clarity.yml

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - name: Apply clarity patch
        run: |
          python .github/scripts/fix_workbench_patch_regex.py
          python .github/scripts/workbench_clarity_patch.py
          dart format \
            lib/src/presentation_v2/environment/v2_environment_workbench_page.dart \
            lib/src/features/today/application/environment_visualization.dart \
            test/presentation_v2/environment/v2_environment_workbench_page_test.dart \
            test/features/today/environment_visualization_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run focused workbench tests
        run: |
          flutter test --reporter expanded \
            test/presentation_v2/environment/v2_environment_workbench_page_test.dart \
            test/features/today/environment_visualization_test.dart

      - name: Commit validated product changes
        run: |
          rm -f \
            .github/scripts/workbench_clarity_patch.py \
            .github/scripts/fix_workbench_patch_regex.py \
            .github/workflows/one-shot-workbench-clarity.yml
          git config user.name "muee91"
          git config user.email "55554607+muee91@users.noreply.github.com"
          git add -A
          git commit -m "fix: make environment workbench actionable"
          git push origin HEAD:main
