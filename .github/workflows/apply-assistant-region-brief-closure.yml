name: Apply assistant region brief closure

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'agent/assistant-region-brief-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/lumanest-data-broker/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Apply implementation
        run: |
          python3 tool/apply_assistant_region_brief_closure.py
          python3 tool/fix_assistant_region_brief_closure.py
          python3 tool/fix_assistant_server_tests.py
          dart format lib/src/presentation_v2/intelligence/v2_intelligence_page.dart

      - name: Test Data Broker
        working-directory: services/lumanest-data-broker
        run: |
          npm ci
          npm test

      - name: Analyze Flutter
        run: |
          flutter pub get
          flutter analyze

      - name: Test intelligence surface
        run: flutter test test/presentation_v2/intelligence/v2_intelligence_page_test.dart

      - name: Remove one-shot assets
        run: |
          git rm -f tool/apply_assistant_region_brief_closure.py
          git rm -f tool/fix_assistant_region_brief_closure.py
          git rm -f tool/fix_assistant_server_tests.py
          git rm -f .github/workflows/apply-assistant-region-brief-closure.yml

      - name: Commit validated implementation
        run: |
          git config user.name 'LumaNest Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: unify assistant with regional environment context'
          git push origin HEAD:${{ github.head_ref }}
