name: Agent full test diagnostics

on:
  push:
    branches:
      - agent/unified-intelligence-surface
    paths:
      - .github/agent-full-test-diagnostics.trigger

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-intelligence-surface
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Capture full test failure summary
        run: |
          set +e
          flutter test --reporter expanded > /tmp/full-test.txt 2>&1
          status=$?
          {
            echo "FULL_TEST_EXIT=$status"
            echo "--- FAILURE MARKERS ---"
            grep -n -E 'FAILED|TestFailure|Expected:|Actual:|The following TestFailure|Some tests failed|══.*EXCEPTION|Error:' /tmp/full-test.txt | tail -n 220 || true
            echo "--- LOG TAIL ---"
            tail -n 320 /tmp/full-test.txt
          } > .github/intelligence-full-test.txt
          rm .github/workflows/agent-full-test-diagnostics.yml
          rm .github/agent-full-test-diagnostics.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .github/intelligence-full-test.txt
          git add -u
          git commit -m "chore: capture full test diagnostics"
          git push origin HEAD:agent/unified-intelligence-surface
