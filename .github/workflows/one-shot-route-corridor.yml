name: One-shot route corridor intelligence

on:
  push:
    paths:
      - .github/workflows/one-shot-route-corridor.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/lumanest-data-broker/package-lock.json
      - name: Apply route corridor intelligence
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def write(path, content):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:80]!r}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          write('services/lumanest-data-broker/src/context/route-corridor-intelligence.mjs', r'''const facilityKeys = Object.freeze([
  'parking', 'fuel', 'food', 'water', 'toilets', 'shelter', 'restArea',
]);
const restrictionKinds = new Set([
  'closure', 'roadClosure', 'fireRestriction', 'regulation', 'eventChange',
]);

function object(value) {
  return value != null && typeof value === 'object' && !Array.isArray(value);
}

function count(value) {
  return typeof value === 'number' && Number.isInteger(value) && value >= 0 && value <= 1_000
    ? value : 0;
}

function responsive(provider) {
  return provider != null && ['ready', 'noData'].includes(provider.status);
}

function source(provider) {
  const value = provider?.source;
  if (!object(value) || typeof value.id !== 'string' || typeof value.title !== 'string' ||
      typeof value.publisher !== 'string' || typeof value.url !== 'string') return null;
  return {
    id: value.id,
    title: value.title,
    publisher: value.publisher,
    url: value.url,
    license: typeof value.license === 'string' ? value.license : null,
    version: typeof value.version === 'string' ? value.version : null,
  };
}

export function buildRouteCorridorIntelligence({ body, providerResults, generatedAt }) {
  const bundles = Array.isArray(providerResults) ? providerResults : [];
  const segments = [];
  const sourceMap = new Map();
  let availableSegments = 0;

  for (let index = 0; index < body.samples.length; index += 1) {
    const sample = body.samples[index];
    const bundle = object(bundles[index]) ? bundles[index] : null;
    const providers = Array.isArray(bundle?.providers) ? bundle.providers : [];
    const osm = providers.find((item) => item?.id === 'osm');
    const official = providers.find((item) => item?.id === 'officialNotices');
    for (const provider of [osm, official]) {
      const item = source(provider);
      if (item != null && responsive(provider)) sourceMap.set(item.id, item);
    }

    const mapSignal = osm?.status === 'ready'
      ? osm.signals?.find((item) => item?.kind === 'outdoorMapInventory' && item.verification === 'reference')
      : null;
    const attributes = object(mapSignal?.attributes) ? mapSignal.attributes : {};
    const facilities = Object.fromEntries(facilityKeys.map((key) => [key, count(attributes[key])]));
    const mapResponsive = responsive(osm);
    const officialResponsive = responsive(official);
    if (mapResponsive || officialResponsive) availableSegments += 1;

    const restrictions = official?.status === 'ready'
      ? (official.signals ?? []).filter((item) =>
          item?.verification === 'authoritative' && restrictionKinds.has(item.kind))
      : [];
    const restrictionFactIds = restrictions
      .map((item) => typeof item.id === 'string' ? item.id : null)
      .filter(Boolean)
      .slice(0, 4);
    const evidenceFactIds = [
      ...(typeof mapSignal?.id === 'string' ? [mapSignal.id] : []),
      ...restrictionFactIds,
    ].slice(0, 5);
    segments.push({
      progress: Number(sample.progress.toFixed(4)),
      expectedAt: new Date(sample.expectedAt).toISOString(),
      facilities: {
        status: mapSignal != null ? 'reference' : mapResponsive ? 'empty' : 'unavailable',
        ...facilities,
      },
      photography: {
        status: mapSignal == null ? (mapResponsive ? 'noReference' : 'unavailable')
          : count(attributes.viewpoint) + count(attributes.historic) > 0 ? 'reference' : 'noReference',
        viewpointCount: count(attributes.viewpoint),
        heritageCount: count(attributes.historic),
      },
      restrictions: {
        status: restrictions.length > 0 ? 'present' : officialResponsive ? 'noneObserved' : 'unavailable',
        kinds: [...new Set(restrictions.map((item) => item.kind))].slice(0, 4),
        authoritative: restrictions.length > 0,
        factIds: restrictionFactIds,
      },
      evidence: {
        status: restrictions.length > 0 ? 'verified' : mapSignal != null ? 'reference' : 'unavailable',
        factIds: evidenceFactIds,
      },
    });
  }

  return {
    contractVersion: 1,
    generatedAt: generatedAt.toISOString(),
    coverage: availableSegments === 0 ? 'unavailable'
      : availableSegments === body.samples.length ? 'full' : 'partial',
    requestedSegments: body.samples.length,
    availableSegments,
    sources: [...sourceMap.values()].slice(0, 4),
    segments,
    limitations: [
      'public_map_inventory_is_reference_only',
      'absence_of_official_notice_is_not_safety_confirmation',
      'precise_route_geometry_excluded',
    ],
  };
}
''')

          write('services/lumanest-data-broker/src/context/route-weather.mjs', r'''import { buildRouteCorridorIntelligence } from './route-corridor-intelligence.mjs';

const maximumRouteWeatherSamples = 5;
const maximumForecastDeltaMilliseconds = 90 * 60 * 1_000;
const maximumForecastHorizonMilliseconds = 24 * 60 * 60 * 1_000;
const allowedRouteWeatherKeys = new Set(['routeId', 'samples']);
const allowedRouteWeatherSampleKeys = new Set([
  'latitude', 'longitude', 'system', 'expectedAt', 'progress',
]);

function exactKeys(value, allowed) {
  return value != null && typeof value === 'object' && !Array.isArray(value) &&
    Object.keys(value).every((key) => allowed.has(key));
}

function validFinite(value, minimum, maximum) {
  return typeof value === 'number' && Number.isFinite(value) && value >= minimum && value <= maximum;
}

export function validRouteWeatherRequest(body, observedAt = new Date()) {
  if (!exactKeys(body, allowedRouteWeatherKeys) ||
      typeof body.routeId !== 'string' || !/^[a-zA-Z0-9_-]{1,64}$/.test(body.routeId) ||
      !Array.isArray(body.samples) || body.samples.length < 2 ||
      body.samples.length > maximumRouteWeatherSamples) return false;
  const now = observedAt.getTime();
  if (!Number.isFinite(now)) return false;
  let previousProgress = -1;
  for (const sample of body.samples) {
    if (!exactKeys(sample, allowedRouteWeatherSampleKeys) || sample.system !== 'wgs84' ||
        !validFinite(sample.latitude, -90, 90) ||
        !validFinite(sample.longitude, -180, 180) ||
        !validFinite(sample.progress, 0, 1) || sample.progress <= previousProgress ||
        typeof sample.expectedAt !== 'string') return false;
    const expectedAt = new Date(sample.expectedAt).getTime();
    if (!Number.isFinite(expectedAt) || expectedAt < now - 15 * 60 * 1_000 ||
        expectedAt > now + maximumForecastHorizonMilliseconds) return false;
    previousProgress = sample.progress;
  }
  return true;
}

function closestHourlyForecast(hourly, expectedAt) {
  if (!Array.isArray(hourly)) return null;
  let closest = null;
  let closestDelta = Number.POSITIVE_INFINITY;
  for (const forecast of hourly) {
    if (forecast == null || typeof forecast !== 'object') continue;
    const forecastAt = new Date(forecast.at).getTime();
    if (!Number.isFinite(forecastAt)) continue;
    const delta = Math.abs(forecastAt - expectedAt.getTime());
    if (delta < closestDelta) {
      closest = forecast;
      closestDelta = delta;
    }
  }
  return closestDelta <= maximumForecastDeltaMilliseconds ? closest : null;
}

function sanitizedSample(sample, weather) {
  if (!weather?.ok) return null;
  const expectedAt = new Date(sample.expectedAt);
  const forecast = closestHourlyForecast(weather.body?.forecast?.hourly, expectedAt);
  if (forecast == null || typeof forecast.condition !== 'string' ||
      typeof forecast.windSpeedMps !== 'number' ||
      typeof forecast.precipitationMm !== 'number') return null;
  const forecastAt = new Date(forecast.at);
  if (!Number.isFinite(forecastAt.getTime())) return null;
  return {
    progress: sample.progress,
    expectedAt: expectedAt.toISOString(),
    forecastAt: forecastAt.toISOString(),
    condition: forecast.condition,
    cloudCoverPercent: typeof forecast.cloudCoverPercent === 'number' ? forecast.cloudCoverPercent : null,
    windSpeedMps: forecast.windSpeedMps,
    precipitationMm: forecast.precipitationMm,
    visibilityKm: typeof forecast.visibilityKm === 'number' ? forecast.visibilityKm : null,
    thunder: forecast.thunder === true,
    stale: weather.cache === 'stale',
  };
}

export async function routeWeatherForecast({
  body,
  fetchWeather,
  fetchCorridorFacts = null,
  observe = null,
  now = () => new Date(),
}) {
  const generatedAt = now();
  const results = await Promise.all(body.samples.map(async (sample) => {
    const [weather, corridor] = await Promise.all([
      Promise.resolve().then(() => fetchWeather({ latitude: sample.latitude, longitude: sample.longitude })).catch(() => null),
      typeof fetchCorridorFacts === 'function'
        ? Promise.resolve().then(() => fetchCorridorFacts(sample)).catch(() => null)
        : Promise.resolve(null),
    ]);
    return { weather: sanitizedSample(sample, weather), corridor };
  }));
  const samples = results.map((item) => item.weather).filter((sample) => sample != null);
  if (samples.length === 0) return { ok: false, error: 'upstream_unavailable' };
  const corridor = buildRouteCorridorIntelligence({
    body,
    providerResults: results.map((item) => item.corridor),
    generatedAt,
  });
  if (typeof observe === 'function') observe(corridor);
  return {
    ok: true,
    body: {
      routeId: body.routeId,
      generatedAt: generatedAt.toISOString(),
      source: 'QWeather',
      coverage: samples.length === body.samples.length ? 'full' : 'partial',
      requestedSamples: body.samples.length,
      availableSamples: samples.length,
      samples,
      corridor,
    },
  };
}
''')

