name: One-shot route corridor intelligence

on:
  push:
    paths:
      - .github/workflows/one-shot-route-corridor.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/lumanest-data-broker/package-lock.json
      - name: Apply route corridor intelligence
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          source = subprocess.check_output([
              'git', 'show',
              '16248e5e3d45bd66d654c37894ef9a99381ff711:.github/workflows/one-shot-route-corridor.yml',
          ], text=True)
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.rindex('\n          PY')
          source_lines = source[start:end].splitlines()
          lines = []
          in_literal = False
          for line in source_lines:
              normalized = line if in_literal else (line[10:] if line.startswith('          ') else line)
              lines.append(normalized)
              if line.count("'''") % 2 == 1:
                  in_literal = not in_literal
          script = '\n'.join(lines)
          exec(compile(script, '<route-corridor-patch>', 'exec'))

          server_path = Path('services/lumanest-data-broker/src/server.mjs')
          server = server_path.read_text(encoding='utf-8')
          server = server.replace(
              'operationalObservability.recordRouteCorridor',
              'activeOperationalObservability.recordRouteCorridor',
          )
          server_path.write_text(server, encoding='utf-8')

          route_path = Path('services/lumanest-data-broker/src/assistant/route-scout-context.mjs')
          route = route_path.read_text(encoding='utf-8')
          anchor = "      lines.push(`路线${routeProgressLabel(sample.progress)}（预计 ${new Date(sample.expectedAt).toISOString()}）：${parts.join('，')}${sample.stale === true ? '；该点使用过期缓存，仅作低置信参考' : ''}。`);"
          replacement = "      lines.push(`路线${routeProgressLabel(sample.progress)}（预计 ${new Date(sample.expectedAt).toISOString()}）：${parts.join('，')}${sample.stale === true ? '；该点使用过期缓存，仅作低置信参考' : ''}${sample.thunder === true ? '；雷暴等安全风险只以安全卡和官方预警为准' : ''}。`);"
          if route.count(anchor) != 1:
              raise SystemExit('route inline safety anchor mismatch')
          route_path.write_text(route.replace(anchor, replacement), encoding='utf-8')
          PY
      - name: Test data broker
        working-directory: services/lumanest-data-broker
        run: |
          npm ci
          npm test
      - name: Commit route corridor intelligence
        shell: bash
        run: |
          rm .github/workflows/one-shot-route-corridor.yml
          git config user.name "muee91"
          git config user.email "55554607+muee91@users.noreply.github.com"
          git add -A
          git commit -m "feat: add route corridor intelligence"
          git push origin HEAD:main
