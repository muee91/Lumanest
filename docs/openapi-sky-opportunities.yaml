openapi: 3.1.0
info:
  title: LumaNest Sky Opportunity API
  version: 2.0.0
paths:
  /v1/sky-opportunities:
    get:
      summary: Resolve one sunrise or sunset photography opportunity
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: event, in: query, required: true, schema: { type: string, enum: [sunrise, sunset] } }
        - { name: dayOffset, in: query, required: true, schema: { type: integer, enum: [0, 1] } }
        - { name: locale, in: query, required: false, schema: { type: string, default: zh-CN, enum: [zh-CN, en] } }
      responses:
        '200': { description: Available or safely degraded result }
        '400': { description: Invalid query }
        '401': { description: Unauthorized }
  /v1/sky-opportunities/daily:
    get:
      summary: Resolve the bounded next-light batch without more than four cold upstream requests
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: locale, in: query, required: false, schema: { type: string, default: zh-CN, enum: [zh-CN, en] } }
        - { name: focus, in: query, required: true, schema: { type: string, enum: [next, preSunrise] } }
      responses:
        '200': { description: The requested current or pre-sunrise pair, plus an optional tomorrow-sunset envelope }
        '400': { description: Invalid query }
        '401': { description: Unauthorized }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
